[project]
name = "vaani"
version = "0.1.0"
description = "Real-time personal voice translation and meeting assistant"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
]

[project.optional-dependencies]
# Speech recognition. onnxruntime is also what runs the Silero VAD.
stt = [
    "faster-whisper>=1.1",
    "onnxruntime>=1.20",
]

# Local translation (NLLB-200 via CTranslate2).
#
# transformers is UPPER-BOUNDED deliberately. coqui-tts declares
# `transformers>=4.57` with no upper bound, but transformers 5.x removed
# `isin_mps_friendly` from `transformers.pytorch_utils`, which coqui imports.
# Installing the latest transformers therefore satisfies pip and then fails at
# import time with an ImportError. 4.57.x satisfies both.
translate = [
    "transformers>=4.57,<5",
    "sentencepiece>=0.2",
]

# Personal-voice synthesis (XTTS-v2).
# The [codec] extra pulls torchcodec, which PyTorch >= 2.9 requires for audio IO;
# without it coqui fails at load with a message pointing at this extra.
voice = [
    "coqui-tts[codec]>=0.27",
    "torch>=2.4",
    "torchaudio>=2.4",
]

# GPU acceleration for CTranslate2 (STT and translation).
# No system CUDA toolkit is needed; these ship the shared objects, and
# `vaani.ai.stt.cuda_setup` preloads them with RTLD_GLOBAL so CTranslate2's
# dlopen() by bare soname resolves.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

all = [
    "vaani[stt,translate,voice,cuda]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
