[project]
name = "vaani"
version = "0.1.0"
description = "Real-time personal voice translation and meeting assistant"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.1",
    "onnxruntime>=1.20",
]
translate = [
    "transformers>=4.57,<5",
    "sentencepiece>=0.2",
]
voice = [
    "coqui-tts[codec]>=0.27",
    "torch>=2.4",
    "torchaudio>=2.4",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
windows = [
    "soundcard>=0.4.6",
]
screen = [
    "opencv-python>=4.10",
]
all = [
    "vaani[stt,translate,voice,cuda,windows,screen]",
]

[project.scripts]
vaani = "vaani.cli:main"
vaani-windows = "vaani.ui.windows_console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
