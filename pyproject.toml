[project]
name = "vaani"
version = "1.0.1"
description = "Real-time personal voice translation and meeting assistant"
license = { text = "MIT" }
authors = [{ name = "Kanak Prabhakar" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
    "soundcard>=0.4.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.1",
    "onnxruntime>=1.20",
]
translate = [
    "transformers>=4.57,<5",
    "sentencepiece>=0.2",
]
voice = [
    "coqui-tts[codec]>=0.27",
    "torch>=2.4",
    "torchaudio>=2.4",
]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
windows = [
    "soundcard>=0.4.6",
]
screen = [
    "opencv-python>=4.10",
]
all = [
    "vaani[stt,translate,voice,cuda,windows,screen]",
]

[project.scripts]
vaani = "vaani.cli:main"
vaani-windows = "vaani.ui.windows_console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# WHY this file gained a ruff section: there was no lint config at all, so ruff
# ran with its own evolving defaults and reported 400 findings - a number too
# large to act on, which meant lint was never actually used as a gate.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# WHAT is selected: the rule families that catch genuine defects, not style.
#   F   - undefined names, unused imports/locals, redefinitions. F821 is the one
#         that caught the real NameError on the voice-test error path.
#   E9  - syntax / IO errors.
#   B   - bugbear: mutable defaults, except-without-from, and B023, the
#         loop-variable-capture cousin of that same NameError bug.
# This set is GREEN on src/ as of Phase 1 and is meant to stay green.
select = ["F", "E9", "B"]

# WHY E501 is not selected: rule 4 asks for heavy explanatory comments, and
# enforcing an 100-column limit on 191 existing comment lines would be pure
# churn against the thing the comments exist for.
# Style families (E4/E7, I, UP, SIM) are deliberately NOT gated yet - they are
# ~385 findings concentrated in the out-of-v1-scope Windows console. Tracked as
# backlog in docs/TASK_PLAN.md rather than pretended to be clean.

[tool.ruff.lint.per-file-ignores]
# Tests legitimately shadow fixtures and import for side effects.
"tests/**" = ["F811", "F401"]
